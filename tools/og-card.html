<!doctype html>
<!--
  Social share card (og:image) for notanothermonday.com — 1200×630.
  Regenerate assets/og.jpg after changing this file or the screenshot:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=4000 --screenshot=og-card.png tools/og-card.html
  then save as JPEG at assets/og.jpg (quality ~88, keep it under 150 KB).
-->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(120% 120% at 100% 0%, #3c604c 0%, #1f3a2d 55%, #16291f 100%);
    font-family: "DM Sans", sans-serif;
    color: #f8f4ec;
  }
  .sun { position: absolute; width: 170px; height: 170px; border-radius: 50%; right: 330px; top: 46px;
         background: radial-gradient(circle at 35% 35%, #fbe6c6, #f7dcb3 60%, #f2cf9c); opacity: .95; }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 1200px; height: 190px; }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 74px; height: 74px; border-radius: 20px; background: #f8f4ec; display: grid; place-items: center; }
  .mark svg { width: 46px; height: 46px; color: #1f3a2d; }
  .name { font-family: "Source Serif 4", serif; font-weight: 700; font-size: 40px; letter-spacing: -0.02em; }
  h1 { font-family: "Source Serif 4", serif; font-weight: 700; font-size: 76px; line-height: 1.0; letter-spacing: -0.035em; margin-top: 38px; }
  h1 span { color: #f7dcb3; }
  .sub { margin-top: 22px; font-size: 25px; color: rgba(248,244,236,.82); max-width: 520px; line-height: 1.35; }
  .pill { margin-top: 34px; display: inline-flex; align-self: flex-start; align-items: center; gap: 12px;
          padding: 14px 24px 14px 18px; border-radius: 16px; background: #f8f4ec; color: #1f3a2d; font-weight: 700; font-size: 24px; }
  .pill svg { width: 28px; height: 28px; }
  .phone {
    position: absolute; right: 110px; top: 70px;
    width: 300px; height: 648px; padding: 11px; border-radius: 50px;
    background: linear-gradient(145deg, #3a3f3c, #0d0f0e 40%, #1b1e1c);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12), 0 40px 80px -20px rgba(0,0,0,.6);
    transform: rotate(6deg);
  }
  .phone .screen { width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: #fffdf8; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="sun"></div>
  <svg class="hills" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 110C180 60 340 72 520 100C700 128 860 70 1040 64C1120 61 1170 72 1200 80V190H0Z" fill="#284536"/>
    <path d="M0 160C180 132 340 140 500 156C680 174 840 140 1010 136C1110 134 1170 146 1200 152V190H0Z" fill="#2f5040"/>
  </svg>

  <div class="copy">
    <div class="brand">
      <span class="mark"><svg viewBox="20 18 60 56" fill="currentColor">
        <path d="M50 22.9C56 30 58.2 36 58.2 42C58.2 49 54.5 54.5 50 59.2C45.5 54.5 41.8 49 41.8 42C41.8 36 44 30 50 22.9Z"/>
        <path d="M23.6 47.4C37 47.6 46.5 56.5 48.8 70C35 71.4 25 62.5 23.6 47.4Z"/>
        <path d="M76.4 47.4C63 47.6 53.5 56.5 51.2 70C65 71.4 75 62.5 76.4 47.4Z"/>
      </svg></span>
      <span class="name">Not Another Monday</span>
    </div>
    <h1>Small steps.<br><span>A brighter you.</span></h1>
    <p class="sub">A calm habit tracker for streaks, water, steps, weight and fasting.</p>
    <span class="pill">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.886.06 4.374 2.19-.13.09-2.383 1.37-2.383 4.19 0 3.26 2.854 4.42 2.955 4.45z"/></svg>
      Free on the App Store
    </span>
  </div>

  <div class="phone"><div class="screen"><img src="../assets/screens/glance.webp" alt=""></div></div>
</body>
</html>
